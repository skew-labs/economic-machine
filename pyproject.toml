[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-machine-commerce"
version = "0.1.0"
description = "Deterministic economic runtime, user-owned operations console and x402 agent commerce"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "eth-account>=0.13,<1"]

[project.optional-dependencies]
verification = ["web3>=7,<8", "eth-tester[py-evm]>=0.13.0b1,<0.15", "ruff>=0.9,<1"]

[project.scripts]
economic-machine = "economic_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
