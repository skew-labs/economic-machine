location = /commerce/swap {
    proxy_pass http://127.0.0.1:4271;
    proxy_set_header Host $host;
}
location /commerce/swap-assets/ {
    proxy_pass http://127.0.0.1:4271;
    proxy_set_header Host $host;
}
location /commerce/swap-api/ {
    limit_req zone=machine_fuel burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    client_body_timeout 10s;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:4271;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
location /commerce/api/engine/fuel/ {
    limit_req zone=machine_fuel burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:4261/api/engine/fuel/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /commerce/;
    access_log off;
}
