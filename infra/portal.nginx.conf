location = /commerce { return 302 /commerce/; }
location /commerce/api/ {
    proxy_pass http://127.0.0.1:4261/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /commerce/;
    proxy_read_timeout 30s;
    access_log off;
}
location = /commerce/healthz {
    proxy_pass http://127.0.0.1:4261/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /commerce/ {
    proxy_pass http://127.0.0.1:4270/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
}
